# OpenClaw Fly.io BETA deployment configuration
# Used for staging / pre-release testing before promoting to production.
#
# Deploy with:
#   fly deploy --config fly.beta.toml
#
# Push image first:
#   ./scripts/deploy-fly.sh --env beta
#
# See https://fly.io/docs/reference/configuration/

app = "openclaw-beta"
primary_region = "iad" # change to your closest region

[build]
image = "registry.fly.io/clawpod-registry:beta"

[env]
NODE_ENV = "production"
OPENCLAW_PREFER_PNPM = "1"
OPENCLAW_STATE_DIR = "/data"
NODE_OPTIONS = "--max-old-space-size=1536"

[processes]
app = "node openclaw.mjs gateway --allow-unconfigured --bind lan"

[http_service]
internal_port = 18789
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[[vm]]
size = "shared-cpu-2x"
memory = "2048mb"

[mounts]
source = "openclaw_beta_data"
destination = "/data"
