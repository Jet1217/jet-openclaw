# OpenClaw Fly.io deployment configuration
# See https://fly.io/docs/reference/configuration/

app = "openclaw"
primary_region = "iad" # change to your closest region

[build]
dockerfile = "Dockerfile"

[env]
NODE_ENV = "production"
# Fly uses x86, but keep this for consistency
OPENCLAW_PREFER_PNPM = "1"
OPENCLAW_STATE_DIR = "/data"
NODE_OPTIONS = "--max-old-space-size=2560"

[processes]
app = "node openclaw.mjs gateway --allow-unconfigured --bind lan"

[http_service]
internal_port = 18789
force_https = true
auto_stop_machines = false # Keep running for persistent connections
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

[[http_service.checks]]
  interval = "60s"
  timeout = "30s"
  grace_period = "60m"
  method = "GET"
  path = "/healthz"

[[vm]]
size = "shared-cpu-4x"
memory = "4096mb"

[mounts]
source = "openclaw_data"
destination = "/data"
